<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok authorization · Jarvis Content OS</title>
<style>
body{display:grid;place-items:center;min-height:100vh;margin:0;font:16px system-ui;background:#07101f;color:#eef6ff}
.box{max-width:620px;padding:32px;border:1px solid #24415f;border-radius:20px;background:#0d1b30}
p{color:#b8c8da}
</style>
</head>
<body>
<div class="box">
<h1>TikTok authorization</h1>
<p id="msg">Authorization received. Returning to the local Jarvis Content OS integration…</p>
<noscript>Please enable JavaScript to complete the local integration callback.</noscript>
</div>
<script>
(function(){
  const target='http://127.0.0.1:9130/api/oauth/callback'+window.location.search;
  setTimeout(()=>window.location.replace(target),350);
})();
</script>
</body>
</html>
